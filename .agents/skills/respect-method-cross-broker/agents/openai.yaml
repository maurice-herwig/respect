interface:
  display_name: "ReSpect Cross Broker"
  short_description: "CLI repair plus broker feedback"
  default_prompt: "Use $respect-method-cross-broker as the ReSpect cross-broker agent: read assets/grammar/Spectra.xtext and the skill workflow reference before drafting, convert natural-language requirements into Spectra, save stable phase-boundary Spectra versions under specs/ plus final.spectra and repair_log.jsonl, validate with spectra-cli.jar, repair syntax errors for at most 3 loops, repair unrealizability using CLI counter-strategy diagnostics only when consistent with the natural-language description, synthesize a JIT controller when realizable, submit the synthesized Spectra file to experiments/cross_broker.py for peer disagreement feedback, read the broker feedback file, and run at most 3 broker-repair loops only when disagreement words justify a change under the natural-language description. Treat peer feedback as fallible disagreement evidence, not ground truth. Do not run controller_tests or benchmark oracle checks. Report cli_status, repair_loops, syntax_repair_loops, unrealizable_repair_loops, broker_repair_loops, timeout_seconds, used_counter_strategy, blocked_by_nl_conflict, diagnostic_file, broker_feedback_status, broker_feedback_file, broker_witnesses_received, broker_repair_decision, accepted_by_self_rejected_by_peer_repaired, accepted_by_self_rejected_by_peer_ignored, rejected_by_self_accepted_by_peer_repaired, rejected_by_self_accepted_by_peer_ignored, spectra_file, controller_output_dir, artifact_dir, and repair_log_file."
