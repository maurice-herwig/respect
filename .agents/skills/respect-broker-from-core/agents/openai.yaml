interface:
  display_name: "ReSpect Broker From Core"
  short_description: "Cross-repair incumbent from shared core Spectra"
  default_prompt: "Use $respect-broker-from-core to start from core_final.spectra plus core_context.full.json. Do not redraft from scratch. Copy the core Spectra to specs/00_from_core.spectra, validate, check well-separation, synthesize, submit to experiments/cross_broker.py with the supplied --runs-root/run-id/agent/round metadata, and repair only broker disagreement feedback justified by the natural-language requirements. Do not run controller_tests or read source Spectra/benchmark oracles."
