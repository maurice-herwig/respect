interface:
  display_name: "ReSpect Self-Test From Core"
  short_description: "Run self-generated controller tests from a shared core Spectra"
  default_prompt: "Use $respect-self-test-from-core to start from core_final.spectra plus core_context.full.json. Do not redraft from scratch. Copy the core Spectra to specs/00_from_core.spectra, validate, synthesize or reuse the controller, write NL-guided controller_tests .rtest plans, compile and run them, and repair Spectra only when a failing self-generated test is justified by the natural-language requirements. Report repair counts, test counts, spectra_file, controller_output_dir, artifact_dir, repair_log_file, and parent_spectra_file."
