interface:
  display_name: "ReSpect Method 2"
  short_description: "Generate Spectra and validate it with the Spectra CLI"
  default_prompt: "Use $respect-method-2 as the ReSpect method-2 agent: convert natural-language requirements into a Spectra specification, validate it only with spectra-cli.jar, repair only CLI-reported syntax errors for at most 3 loops, count repair_loops, check realizability, synthesize only when realizable, and report cli_status, repair_loops, timeout_seconds, spectra_file, and controller_output_dir. Do not run additional tests or equivalence checks."
