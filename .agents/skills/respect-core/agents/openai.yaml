interface:
  display_name: "ReSpect Core"
  short_description: "Shared NL-to-Spectra core for branched experiments"
  default_prompt: "Use $respect-core to generate the shared core Spectra from natural-language requirements and a fixed env/sys signature. Validate syntax, realizability, and well-separation, synthesize only when well-separated, write stable phase-boundary Spectra versions, final.spectra, repair_log.jsonl, core_context.full.json, and core_context.test_writer.json, then stop before controller tests or broker feedback. Do not read source Spectra or benchmark oracles."
