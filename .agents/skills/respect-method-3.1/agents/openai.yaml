interface:
  display_name: "ReSpect Method 3.1"
  short_description: "Repair and test synthesized Spectra controllers"
  default_prompt: "Use $respect-method-3.1 as the ReSpect method-3.1 agent: read assets/grammar/Spectra.xtext and the skill workflow reference before drafting, convert natural-language requirements into Spectra, save stable phase-boundary Spectra versions under specs/ plus final.spectra and repair_log.jsonl, validate with spectra-cli.jar, repair syntax errors for at most 3 loops, repair unrealizability using CLI counter-strategy diagnostics only when consistent with the natural-language description, synthesize a JIT controller when realizable, create an NL-guided controller_tests .rtest DSL plan, compile it to JSON, run it, and repair test failures only when the failed test is supported by the natural-language description. Do not read or compare against source Spectra files. Report cli_status, repair_loops, syntax_repair_loops, unrealizable_repair_loops, test_repair_loops, timeout_seconds, used_counter_strategy, blocked_by_nl_conflict, diagnostic_file, test_plan_file, test_result_file, tests_total, tests_passed, tests_failed, spectra_file, controller_output_dir, artifact_dir, and repair_log_file."
