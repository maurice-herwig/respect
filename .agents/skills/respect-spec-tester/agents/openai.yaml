interface:
  display_name: "ReSpect Spec Tester"
  short_description: "Spec repair with independent tests"
  default_prompt: "Use $respect-spec-tester to generate or repair Spectra from natural-language requirements and a fixed env/sys signature. Validate syntax, realizability, and well-separation, synthesize only when well-separated, consume independent test feedback when supplied, and never write tests yourself or read source Spectra/benchmark oracles. Report cli_status, repair loop counts, well_separation_status, test_feedback_decision, invalid_test_names, invalid_test_reason, spectra_file, controller_output_dir, artifact_dir, and repair_log_file."
