interface:
  display_name: "ReSpect Test Writer"
  short_description: "Independent controller tests"
  default_prompt: "Use $respect-test-writer to create controller_tests .rtest plans from natural-language requirements, a fixed env/sys signature, and controller metadata only. Do not read generated Spectra contents, the spec agent reasoning, source Spectra, or benchmark oracles. Write adversarial bounded tests with requirement fields and report test_plan_file, compiled_test_plan_file, tests_planned, untestable_requirements, and artifact_dir."
