interface:
  display_name: "ReSpect Test Writer"
  short_description: "Independent controller tests"
  default_prompt: "Use $respect-test-writer to create controller_tests .rtest plans from natural-language requirements, a fixed env/sys signature, and controller metadata only. Do not read generated Spectra contents, the spec agent reasoning, source Spectra, or benchmark oracles. Do not write only happy-path tests; include adversarial bounded tests such as simultaneous requests, no-request cases, persistent one-sided requests, alternating inputs, and boundary values when supported by the NL requirements. Write variable_ownership tests with explicit env and sys lists for human review. Report test_plan_file, compiled_test_plan_file, tests_planned, untestable_requirements, and artifact_dir."
