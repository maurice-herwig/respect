interface:
  display_name: "ReSpect Method 3"
  short_description: "Repair unrealizable Spectra using CLI counter-strategy diagnostics"
  default_prompt: "Use $respect-method-3 as the ReSpect method-3 agent: convert natural-language requirements into Spectra, validate with spectra-cli.jar, repair syntax errors for at most 3 loops, and when the specification is unrealizable request CLI counter-strategy diagnostics and repair only changes consistent with the natural-language description. Do not read or compare against source Spectra files. Report cli_status, repair_loops, syntax_repair_loops, unrealizable_repair_loops, timeout_seconds, used_counter_strategy, blocked_by_nl_conflict, diagnostic_file, spectra_file, and controller_output_dir."
