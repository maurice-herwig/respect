<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3a45"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2d3d; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #52606d; }
      .lane-title { font-size: 22px; font-weight: 700; }
      .box-title { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; fill: #34495e; }
      .small { font-size: 12px; fill: #52606d; }
      .lane { fill: #ffffff; stroke: #d8e2ec; stroke-width: 2; rx: 12; }
      .box { fill: #ffffff; stroke: #9fb3c8; stroke-width: 2; rx: 8; }
      .input { fill: #eef6ff; stroke: #4a90e2; }
      .cli { fill: #f7f3ff; stroke: #8e6ad8; }
      .repair { fill: #fff7e6; stroke: #f5a623; }
      .stop { fill: #fff0f0; stroke: #d64545; }
      .success { fill: #effaf3; stroke: #43a047; }
      .test { fill: #eafaf8; stroke: #00a99d; }
      .arrow { stroke: #2f3a45; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 5; }
      .divider { stroke: #d8e2ec; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1320" height="820" fill="#f8fafc"/>
  <text x="60" y="58" class="title">ReSpect Skill Comparison</text>
  <text x="60" y="86" class="subtitle">Method 2 uses CLI executability feedback; Method 3 adds unrealizability diagnostics and NL-guided controller tests.</text>

  <rect x="50" y="125" width="590" height="640" class="lane"/>
  <rect x="680" y="125" width="590" height="640" class="lane"/>
  <line x1="660" y1="125" x2="660" y2="765" class="divider"/>

  <text x="80" y="165" class="lane-title">Method 2</text>
  <text x="710" y="165" class="lane-title">Method 3</text>

  <text x="80" y="190" class="subtitle">CLI-validated synthesis</text>
  <text x="710" y="190" class="subtitle">CLI diagnostics + controller tests</text>

  <!-- Method 2 lane -->
  <rect x="90" y="225" width="210" height="72" class="box input"/>
  <text x="112" y="255" class="box-title">NL Description</text>
  <text x="112" y="280" class="body">Natural-language requirements</text>

  <rect x="370" y="225" width="210" height="72" class="box input"/>
  <text x="392" y="255" class="box-title">Draft Spectra</text>
  <text x="392" y="280" class="body">Agent writes .spectra file</text>

  <rect x="230" y="335" width="210" height="82" class="box cli"/>
  <text x="252" y="365" class="box-title">CLI Check</text>
  <text x="252" y="390" class="body">Parse + realizability</text>

  <rect x="90" y="465" width="210" height="82" class="box repair"/>
  <text x="112" y="495" class="box-title">Syntax Repair</text>
  <text x="112" y="520" class="body">Only parser/CLI errors</text>
  <text x="112" y="540" class="small">max 3 loops</text>

  <rect x="370" y="465" width="210" height="82" class="box stop"/>
  <text x="392" y="495" class="box-title">Unrealizable</text>
  <text x="392" y="520" class="body">Stop and report</text>
  <text x="392" y="540" class="small">No semantic repair</text>

  <rect x="230" y="595" width="210" height="82" class="box success"/>
  <text x="252" y="625" class="box-title">Synthesize</text>
  <text x="252" y="650" class="body">Create JIT controller</text>
  <text x="252" y="670" class="small">cli_status = synthesized</text>

  <path d="M300 261 H370" class="arrow"/>
  <path d="M475 297 C475 320 335 315 335 335" class="arrow"/>
  <path d="M300 376 H230" class="arrow"/>
  <path d="M335 417 C335 445 195 440 195 465" class="arrow"/>
  <path d="M195 465 C195 430 335 430 335 417" class="arrow dash"/>
  <path d="M440 376 C495 400 500 435 475 465" class="arrow"/>
  <path d="M335 417 V595" class="arrow"/>

  <text x="98" y="438" class="small">syntax_error</text>
  <text x="474" y="438" class="small">unrealizable</text>
  <text x="350" y="565" class="small">realizable</text>

  <!-- Method 3 lane -->
  <rect x="720" y="225" width="210" height="72" class="box input"/>
  <text x="742" y="255" class="box-title">NL Description</text>
  <text x="742" y="280" class="body">Natural-language requirements</text>

  <rect x="1000" y="225" width="210" height="72" class="box input"/>
  <text x="1022" y="255" class="box-title">Draft Spectra</text>
  <text x="1022" y="280" class="body">Agent writes .spectra file</text>

  <rect x="860" y="335" width="210" height="82" class="box cli"/>
  <text x="882" y="365" class="box-title">CLI Check</text>
  <text x="882" y="390" class="body">Parse + realizability</text>

  <rect x="720" y="465" width="210" height="82" class="box repair"/>
  <text x="742" y="495" class="box-title">Syntax Repair</text>
  <text x="742" y="520" class="body">Parser/CLI errors</text>
  <text x="742" y="540" class="small">max 3 loops</text>

  <rect x="1000" y="465" width="210" height="92" class="box repair"/>
  <text x="1022" y="495" class="box-title">Unrealizability Repair</text>
  <text x="1022" y="520" class="body">Counter-strategy diagnostics</text>
  <text x="1022" y="540" class="small">Only if consistent with NL</text>

  <rect x="780" y="605" width="210" height="82" class="box success"/>
  <text x="802" y="635" class="box-title">Synthesize</text>
  <text x="802" y="660" class="body">Create JIT controller</text>
  <text x="802" y="680" class="small">cli_status = synthesized</text>

  <rect x="1040" y="605" width="190" height="92" class="box test"/>
  <text x="1062" y="635" class="box-title">NL-Guided Tests</text>
  <text x="1062" y="660" class="body">Create test plan</text>
  <text x="1062" y="680" class="body">Run TestRunner</text>

  <rect x="860" y="710" width="220" height="58" class="box repair"/>
  <text x="882" y="735" class="box-title">Test-Based Repair</text>
  <text x="882" y="756" class="small">Only if failed test is justified by NL</text>

  <path d="M930 261 H1000" class="arrow"/>
  <path d="M1105 297 C1105 320 965 315 965 335" class="arrow"/>
  <path d="M860 376 H790 C750 376 750 445 825 465" class="arrow"/>
  <path d="M825 465 C825 430 965 430 965 417" class="arrow dash"/>
  <path d="M1070 376 C1140 405 1135 440 1105 465" class="arrow"/>
  <path d="M1105 557 C1105 585 885 575 885 605" class="arrow dash"/>
  <path d="M965 417 C965 505 885 520 885 605" class="arrow"/>
  <path d="M990 646 H1040" class="arrow"/>
  <path d="M1135 697 C1135 725 1080 735 1080 739" class="arrow"/>
  <path d="M860 739 C760 720 760 520 825 547" class="arrow dash"/>

  <text x="728" y="438" class="small">syntax_error</text>
  <text x="1104" y="438" class="small">unrealizable</text>
  <text x="910" y="575" class="small">realizable</text>
  <text x="1112" y="728" class="small">tests fail</text>

  <rect x="70" y="720" width="560" height="35" fill="none"/>
  <text x="80" y="743" class="small">Method 2 final evidence: CLI status, repair loop count, synthesized controller path.</text>
  <rect x="700" y="775" width="560" height="35" fill="none"/>
  <text x="710" y="798" class="small">Method 3 final evidence: CLI status plus test plan, test result, test counts, and repair loop counts.</text>
</svg>
