<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34495e"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1f2d3d; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #52606d; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #34495e; }
      .small { font-size: 12px; fill: #52606d; }
      .box { fill: #ffffff; stroke: #9fb3c8; stroke-width: 2; rx: 8; }
      .plan { fill: #eef6ff; stroke: #4a90e2; }
      .static { fill: #f7f3ff; stroke: #8e6ad8; }
      .exec { fill: #effaf3; stroke: #43a047; }
      .result { fill: #fff7e6; stroke: #f5a623; }
      .warn { fill: #fff0f0; stroke: #d64545; }
      .arrow { stroke: #34495e; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#f8fafc"/>

  <text x="60" y="58" class="title">ReSpect Method 3 Controller Test Workflow</text>
  <text x="60" y="86" class="subtitle">How a JSON test plan selects checks against generated Spectra code and the synthesized JIT controller</text>

  <rect x="60" y="130" width="250" height="210" class="box plan"/>
  <text x="82" y="165" class="box-title">JSON Test Plan</text>
  <text x="82" y="198" class="body">controller_dir</text>
  <text x="82" y="222" class="body">spec_name</text>
  <text x="82" y="246" class="body">spectra_file</text>
  <text x="82" y="270" class="body">outputs</text>
  <text x="82" y="294" class="body">tests[]</text>
  <text x="82" y="320" class="small">Each test chooses kind, mode, env domains,</text>
  <text x="82" y="338" class="small">trace data, and expected properties.</text>

  <rect x="390" y="130" width="250" height="210" class="box"/>
  <text x="412" y="165" class="box-title">TestRunner</text>
  <text x="412" y="198" class="body">1. Parse plan</text>
  <text x="412" y="222" class="body">2. Build TestContext</text>
  <text x="412" y="246" class="body">3. Create TestCase by kind</text>
  <text x="412" y="270" class="body">4. Run tests independently</text>
  <text x="412" y="294" class="body">5. Print JSON summary</text>

  <rect x="720" y="130" width="220" height="100" class="box static"/>
  <text x="742" y="165" class="box-title">Spectra Code</text>
  <text x="742" y="198" class="body">generated .spectra</text>
  <text x="742" y="220" class="small">Used by static checks.</text>

  <rect x="720" y="260" width="220" height="100" class="box exec"/>
  <text x="742" y="295" class="box-title">JIT Controller</text>
  <text x="742" y="328" class="body">*.bdd, *.sizes, *.vars.doms</text>
  <text x="742" y="350" class="small">Loaded by ControllerExecutor.</text>

  <rect x="1010" y="180" width="210" height="130" class="box result"/>
  <text x="1032" y="215" class="box-title">JSON Result</text>
  <text x="1032" y="248" class="body">passed / failed</text>
  <text x="1032" y="272" class="body">failure reason</text>
  <text x="1032" y="296" class="body">counterexample trace</text>

  <path d="M310 235 H390" class="arrow"/>
  <path d="M640 205 H720" class="arrow"/>
  <path d="M640 290 H720" class="arrow"/>
  <path d="M940 245 H1010" class="arrow"/>

  <rect x="60" y="420" width="220" height="160" class="box static"/>
  <text x="82" y="455" class="box-title">variable_ownership</text>
  <text x="82" y="488" class="body">Checks env/sys declarations</text>
  <text x="82" y="512" class="body">in the Spectra file.</text>
  <text x="82" y="546" class="small">Example: carA is env,</text>
  <text x="82" y="564" class="small">greenA is sys.</text>

  <rect x="310" y="420" width="220" height="160" class="box exec"/>
  <text x="332" y="455" class="box-title">initial_condition</text>
  <text x="332" y="488" class="body">Runs initState(inputs).</text>
  <text x="332" y="512" class="body">Checks first output values.</text>
  <text x="332" y="546" class="small">Good for initial guarantees.</text>

  <rect x="560" y="420" width="220" height="160" class="box exec"/>
  <text x="582" y="455" class="box-title">exclusion</text>
  <text x="582" y="488" class="body">Runs traces or exploration.</text>
  <text x="582" y="512" class="body">Fails if forbidden valuation</text>
  <text x="582" y="536" class="body">is reached.</text>
  <text x="582" y="564" class="small">Example: never both green.</text>

  <rect x="810" y="420" width="220" height="160" class="box exec"/>
  <text x="832" y="455" class="box-title">always_implication</text>
  <text x="832" y="488" class="body">Whenever when holds,</text>
  <text x="832" y="512" class="body">then must hold immediately.</text>
  <text x="832" y="546" class="small">Pattern: alw (A -> B).</text>

  <rect x="1060" y="420" width="170" height="160" class="box exec"/>
  <text x="1082" y="455" class="box-title">eventually_response</text>
  <text x="1082" y="488" class="body">When trigger holds,</text>
  <text x="1082" y="512" class="body">target must occur</text>
  <text x="1082" y="536" class="body">within a bound.</text>
  <text x="1082" y="564" class="small">Bounded liveness evidence.</text>

  <path d="M185 340 V420" class="arrow dash"/>
  <path d="M445 340 V420" class="arrow dash"/>
  <path d="M515 340 C515 380 670 380 670 420" class="arrow dash"/>
  <path d="M560 340 C610 390 920 370 920 420" class="arrow dash"/>
  <path d="M600 340 C710 405 1145 360 1145 420" class="arrow dash"/>

  <rect x="310" y="640" width="660" height="70" class="box warn"/>
  <text x="332" y="670" class="box-title">Exploration Modes</text>
  <text x="332" y="696" class="body">trace: replay explicit inputs | random: seeded generated traces | exhaustive: bounded input tree capped by max_paths</text>
</svg>
