<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #4b5563; }
      .lane-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .box-title { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .box-text { font-family: Arial, sans-serif; font-size: 13px; fill: #374151; }
      .small { font-family: Arial, sans-serif; font-size: 12px; fill: #4b5563; }
      .label { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #374151; }
      .lane { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.2; }
      .core { fill: #e0f2fe; stroke: #0369a1; stroke-width: 1.4; }
      .artifact { fill: #ecfdf5; stroke: #047857; stroke-width: 1.4; }
      .self { fill: #fef3c7; stroke: #b45309; stroke-width: 1.4; }
      .ind { fill: #ede9fe; stroke: #6d28d9; stroke-width: 1.4; }
      .cross { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.4; }
      .fresh { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.4; }
      .note { fill: #ffffff; stroke: #9ca3af; stroke-dasharray: 5 4; stroke-width: 1.2; }
      .arrow { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #6b7280; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="1160" fill="#ffffff"/>

  <text x="50" y="48" class="title">Branched NL-to-Spectra Experiment</text>
  <text x="50" y="76" class="subtitle">One shared core reconstruction, then comparable feedback branches with preserved intermediate artifacts.</text>

  <!-- Input -->
  <rect x="50" y="115" width="260" height="88" rx="8" class="fresh"/>
  <text x="72" y="143" class="box-title">Input per NL description</text>
  <text x="72" y="166" class="box-text">natural-language requirements</text>
  <text x="72" y="187" class="box-text">fixed env/sys signature</text>

  <!-- Core lane -->
  <rect x="360" y="105" width="1090" height="220" rx="10" class="lane"/>
  <text x="382" y="134" class="lane-title">1. Shared core_lineage: run once</text>

  <rect x="390" y="160" width="190" height="112" rx="8" class="core"/>
  <text x="410" y="187" class="box-title">Core Spec Skill</text>
  <text x="410" y="210" class="box-text">draft from NL + signature</text>
  <text x="410" y="231" class="box-text">no source Spectra</text>
  <text x="410" y="252" class="box-text">no benchmark oracle</text>

  <rect x="620" y="160" width="260" height="112" rx="8" class="core"/>
  <text x="642" y="187" class="box-title">Core repair phases</text>
  <text x="642" y="210" class="box-text">00_initial.spectra</text>
  <text x="642" y="231" class="box-text">01_after_syntax_repair.spectra</text>
  <text x="642" y="252" class="box-text">02_after_unrealizable_repair.spectra</text>

  <rect x="920" y="160" width="260" height="112" rx="8" class="core"/>
  <text x="942" y="187" class="box-title">Core validation end</text>
  <text x="942" y="210" class="box-text">03_after_well_sep_repair.spectra</text>
  <text x="942" y="231" class="box-text">synthesis / controller_dir</text>
  <text x="942" y="252" class="box-text">final.spectra</text>

  <rect x="1220" y="145" width="200" height="142" rx="8" class="artifact"/>
  <text x="1240" y="173" class="box-title">Core artifacts</text>
  <text x="1240" y="196" class="box-text">core_final.spectra</text>
  <text x="1240" y="217" class="box-text">core_context.full.json</text>
  <text x="1240" y="238" class="box-text">core_context.test_writer.json</text>
  <text x="1240" y="259" class="box-text">repair_log.jsonl</text>

  <path d="M310 159 L390 216" class="arrow"/>
  <path d="M580 216 L620 216" class="arrow"/>
  <path d="M880 216 L920 216" class="arrow"/>
  <path d="M1180 216 L1220 216" class="arrow"/>

  <!-- Branch split -->
  <path d="M1320 287 L1320 360" class="arrow"/>
  <text x="1178" y="345" class="label">same incumbent start point for comparable branches</text>

  <!-- Baseline lane -->
  <rect x="50" y="380" width="310" height="150" rx="10" class="lane"/>
  <text x="72" y="410" class="lane-title">2a. no_test baseline</text>
  <rect x="82" y="435" width="240" height="62" rx="8" class="artifact"/>
  <text x="102" y="462" class="box-title">No repair after core</text>
  <text x="102" y="484" class="box-text">final = core_final.spectra</text>
  <path d="M1220 287 C900 350 510 370 322 456" class="soft-arrow"/>

  <!-- Self-test lane -->
  <rect x="390" y="380" width="500" height="260" rx="10" class="lane"/>
  <text x="412" y="410" class="lane-title">2b. self_test branch</text>

  <rect x="420" y="435" width="190" height="82" rx="8" class="self"/>
  <text x="440" y="462" class="box-title">Self-test skill</text>
  <text x="440" y="484" class="box-text">gets full core context</text>
  <text x="440" y="505" class="box-text">may inspect final Spectra</text>

  <rect x="650" y="435" width="200" height="82" rx="8" class="self"/>
  <text x="670" y="462" class="box-title">Own tests</text>
  <text x="670" y="484" class="box-text">write .rtest</text>
  <text x="670" y="505" class="box-text">compile and run tests</text>

  <rect x="530" y="545" width="260" height="64" rx="8" class="artifact"/>
  <text x="552" y="572" class="box-title">Self-test artifacts</text>
  <text x="552" y="594" class="box-text">00_from_core, 04_after_self_test_repair, final</text>

  <path d="M1220 287 C980 365 720 375 515 435" class="soft-arrow"/>
  <path d="M610 476 L650 476" class="arrow"/>
  <path d="M750 517 L690 545" class="arrow"/>

  <!-- Independent lane -->
  <rect x="930" y="380" width="520" height="330" rx="10" class="lane"/>
  <text x="952" y="410" class="lane-title">2c. independent_test branch</text>

  <rect x="960" y="435" width="210" height="92" rx="8" class="ind"/>
  <text x="980" y="462" class="box-title">Independent Test Writer</text>
  <text x="980" y="484" class="box-text">gets filtered context only</text>
  <text x="980" y="505" class="box-text">must not read Spectra</text>

  <rect x="1210" y="435" width="200" height="92" rx="8" class="ind"/>
  <text x="1230" y="462" class="box-title">External tests</text>
  <text x="1230" y="484" class="box-text">write .rtest from NL</text>
  <text x="1230" y="505" class="box-text">compile/run on controller</text>

  <rect x="1030" y="565" width="240" height="82" rx="8" class="ind"/>
  <text x="1050" y="592" class="box-title">Spec repair skill</text>
  <text x="1050" y="614" class="box-text">gets full core context</text>
  <text x="1050" y="635" class="box-text">gets only test results as feedback</text>

  <rect x="1300" y="575" width="120" height="62" rx="8" class="artifact"/>
  <text x="1318" y="602" class="box-title">Artifacts</text>
  <text x="1318" y="624" class="box-text">00_from_core</text>

  <path d="M1320 287 L1320 435" class="soft-arrow"/>
  <path d="M1170 481 L1210 481" class="arrow"/>
  <path d="M1310 527 C1295 560 1270 584 1270 606" class="arrow"/>
  <path d="M1030 606 L950 606 C930 606 930 700 1290 650" class="soft-arrow"/>
  <text x="1287" y="667" class="small">04_after_independent_test_repair + final</text>

  <!-- Cross lane -->
  <rect x="50" y="750" width="1400" height="345" rx="10" class="lane"/>
  <text x="72" y="782" class="lane-title">2d. cross_repair branch: asymmetric independence</text>

  <rect x="90" y="825" width="250" height="112" rx="8" class="cross"/>
  <text x="112" y="852" class="box-title">Incumbent agent</text>
  <text x="112" y="875" class="box-text">starts from core_final.spectra</text>
  <text x="112" y="896" class="box-text">gets full core context</text>
  <text x="112" y="917" class="box-text">target of cross repair</text>

  <rect x="90" y="965" width="250" height="82" rx="8" class="artifact"/>
  <text x="112" y="992" class="box-title">Incumbent artifacts</text>
  <text x="112" y="1014" class="box-text">00_from_core</text>
  <text x="112" y="1035" class="box-text">05_after_cross_feedback_repair + final</text>

  <rect x="420" y="825" width="270" height="112" rx="8" class="fresh"/>
  <text x="442" y="852" class="box-title">Challenger agent</text>
  <text x="442" y="875" class="box-text">fresh run from NL + signature</text>
  <text x="442" y="896" class="box-text">no core_final, no core context</text>
  <text x="442" y="917" class="box-text">independent comparison partner</text>

  <rect x="420" y="965" width="270" height="82" rx="8" class="artifact"/>
  <text x="442" y="992" class="box-title">Challenger artifacts</text>
  <text x="442" y="1014" class="box-text">00_initial, 01_syntax, 02_unrealizable</text>
  <text x="442" y="1035" class="box-text">03_well_sep, final</text>

  <rect x="780" y="835" width="240" height="92" rx="8" class="cross"/>
  <text x="802" y="862" class="box-title">Cross broker</text>
  <text x="802" y="884" class="box-text">compares incumbent vs challenger</text>
  <text x="802" y="905" class="box-text">produces disagreement feedback</text>

  <rect x="1100" y="825" width="270" height="112" rx="8" class="cross"/>
  <text x="1122" y="852" class="box-title">Feedback repair rounds</text>
  <text x="1122" y="875" class="box-text">incumbent repairs from broker feedback</text>
  <text x="1122" y="896" class="box-text">optional challenger repair recorded separately</text>
  <text x="1122" y="917" class="box-text">max broker loops</text>

  <rect x="1110" y="970" width="250" height="62" rx="8" class="artifact"/>
  <text x="1132" y="997" class="box-title">Cross branch result</text>
  <text x="1132" y="1019" class="box-text">primary = incumbent_after_cross_feedback</text>

  <path d="M1220 287 C780 500 360 610 215 825" class="soft-arrow"/>
  <path d="M310 159 C420 450 510 620 555 825" class="soft-arrow"/>
  <path d="M340 881 L780 881" class="arrow"/>
  <path d="M690 881 L780 881" class="arrow"/>
  <path d="M1020 881 L1100 881" class="arrow"/>
  <path d="M1235 937 L1235 970" class="arrow"/>
  <path d="M215 937 L215 965" class="arrow"/>
  <path d="M555 937 L555 965" class="arrow"/>

  <!-- Manifest -->
  <rect x="50" y="1110" width="1400" height="34" rx="8" class="note"/>
  <text x="72" y="1132" class="box-text">Shared manifest fields: description_id, core_run_id, branch, lineage, role, start_source, parent_spectra_file, intermediate_spectra_files, repair_log_file, final_spectra_file, controller_output_dir.</text>
</svg>

