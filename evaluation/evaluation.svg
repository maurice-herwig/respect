<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1780" viewBox="0 0 1280 1780" role="img" aria-labelledby="title desc">
  <title id="title">Controller Distance Evaluation Values</title>
  <desc id="desc">Explanation of per-run and summary values computed by evaluate_controller_distances.py.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #cfd6e3; stroke-width: 1.4; }
      .panel-blue { fill: #f0f6ff; stroke: #9cbce8; stroke-width: 1.4; }
      .panel-green { fill: #eefbf3; stroke: #90caa6; stroke-width: 1.4; }
      .panel-orange { fill: #fff7ed; stroke: #f0b36b; stroke-width: 1.4; }
      .panel-gray { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .title { font: 700 30px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #4b5563; }
      .h2 { font: 700 20px Arial, sans-serif; fill: #1f2937; }
      .h3 { font: 700 15px Arial, sans-serif; fill: #1f2937; }
      .text { font: 400 13px Arial, sans-serif; fill: #374151; }
      .small { font: 400 11.5px Arial, sans-serif; fill: #4b5563; }
      .mono { font: 400 12.5px Consolas, monospace; fill: #111827; }
      .mono-bold { font: 700 12.5px Consolas, monospace; fill: #111827; }
      .formula { font: 700 14px Consolas, monospace; fill: #111827; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #d7deea; stroke-width: 1; }
      .chip { fill: #e8eef8; stroke: #bfccdd; stroke-width: 1; }
      .chip-text { font: 700 11.5px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="1780" />

  <text class="title" x="56" y="58">Controller-Distanz: alle Evaluationswerte</text>
  <text class="subtitle" x="56" y="84">Felder aus `evaluate_controller_distances.py`: pro Vergleichs-Run und als aggregierte Summary</text>

  <rect class="panel" x="56" y="116" width="1168" height="116" rx="8" />
  <text class="h2" x="82" y="150">A. Auswahl der Runs</text>
  <text class="text" x="82" y="178">Aus `experiments/runs/runs.jsonl` werden Runs fuer genau einen `skill` und ein `model` gelesen.</text>
  <text class="text" x="82" y="202">Ausgewertet werden nur erfolgreiche Synthese-Runs: `status = success`, `reported_cli_status = synthesized`, beide Spectra-Dateien vorhanden.</text>
  <rect class="chip" x="826" y="144" width="120" height="26" rx="13" />
  <text class="chip-text" x="844" y="162">other_skill</text>
  <rect class="chip" x="956" y="144" width="120" height="26" rx="13" />
  <text class="chip-text" x="974" y="162">other_model</text>
  <rect class="chip" x="1086" y="144" width="112" height="26" rx="13" />
  <text class="chip-text" x="1104" y="162">skipped</text>
  <rect class="chip" x="826" y="182" width="176" height="26" rx="13" />
  <text class="chip-text" x="844" y="200">cli_status_*</text>
  <rect class="chip" x="1012" y="182" width="186" height="26" rx="13" />
  <text class="chip-text" x="1030" y="200">missing_*_spectra_file</text>

  <rect class="panel-blue" x="56" y="262" width="350" height="190" rx="8" />
  <text class="h2" x="82" y="296">B. Trace-Erzeugung</text>
  <text class="text" x="82" y="324">Input-Alphabet Sigma = kartesisches Produkt</text>
  <text class="text" x="82" y="344">aller Baseline-env-Domains.</text>
  <text class="formula" x="82" y="376">exhaustive: Sigma^max_depth</text>
  <text class="small" x="82" y="400">begrenzt durch `max_paths`</text>
  <text class="formula" x="82" y="428">random: `runs` Traces mit `seed`</text>

  <rect class="panel-blue" x="466" y="262" width="350" height="190" rx="8" />
  <text class="h2" x="492" y="296">C. Controller-Ausfuehrung</text>
  <text class="text" x="492" y="324">Baseline- und generierter Controller werden</text>
  <text class="text" x="492" y="344">in getrennten Java-Prozessen ausgefuehrt.</text>
  <text class="mono" x="492" y="378">Controller A: inputs -> outputs_A</text>
  <text class="mono" x="492" y="404">Controller B: inputs -> outputs_B</text>
  <text class="small" x="492" y="432">`trace_batch_size` steuert Traces pro Prozess.</text>

  <rect class="panel-blue" x="876" y="262" width="348" height="190" rx="8" />
  <text class="h2" x="902" y="296">D. Vergleich</text>
  <text class="text" x="902" y="324">Pro Schritt werden alle sys-Outputs</text>
  <text class="text" x="902" y="344">von A und B verglichen.</text>
  <text class="formula" x="902" y="378">mismatch_step := exists y.</text>
  <text class="formula" x="902" y="402">  outputs_A[y] != outputs_B[y]</text>

  <path class="arrow" d="M406 357 L466 357" />
  <path class="arrow" d="M816 357 L876 357" />

  <rect class="panel" x="56" y="486" width="1168" height="292" rx="8" />
  <text class="h2" x="82" y="520">E. JSONL-Felder pro Vergleichs-Run</text>
  <line class="divider" x1="82" y1="544" x2="1198" y2="544" />

  <text class="h3" x="82" y="574">Identitaet und Ergebnisstatus</text>
  <text class="mono-bold" x="82" y="602">status</text>
  <text class="small" x="254" y="602">Gesamtstatus fuer diesen Vergleich: success, signature_mismatch, unsupported_signature, synthesis_failed, runner_failed, failed.</text>
  <text class="mono-bold" x="82" y="628">comparison_id</text>
  <text class="small" x="254" y="628">Stabiler Ordner-/Vergleichsname aus run_id, run_key oder dataset_id.</text>
  <text class="mono-bold" x="82" y="654">run</text>
  <text class="small" x="254" y="654">Kurzfassung des Experiment-Runs: run_id, dataset_id, skill, source_spectra_file, reconstructed_spectra_file usw.</text>
  <text class="mono-bold" x="82" y="680">error</text>
  <text class="small" x="254" y="680">Fehlertext, falls kein Distanzwert berechnet werden konnte.</text>

  <text class="h3" x="82" y="722">Artefaktpfade</text>
  <text class="mono-bold" x="82" y="750">plan_file</text>
  <text class="small" x="254" y="750">Ordner mit den konkreten Trace-Plans, die an die Java-Runner gegeben wurden.</text>
  <text class="mono-bold" x="614" y="750">result_file</text>
  <text class="small" x="786" y="750">Ordner mit den Trace-Ausgaben der Java-Runner.</text>

  <rect class="panel-gray" x="56" y="812" width="568" height="190" rx="8" />
  <text class="h2" x="82" y="846">F. `baseline_signature` und `generated_signature`</text>
  <text class="mono-bold" x="82" y="878">status</text>
  <text class="small" x="210" y="878">success oder unsupported_signature.</text>
  <text class="mono-bold" x="82" y="904">error</text>
  <text class="small" x="210" y="904">Grund fuer unsupported_signature, z. B. Array-Typ.</text>
  <text class="mono-bold" x="82" y="930">path</text>
  <text class="small" x="210" y="930">Spectra-Datei, aus der die Signatur gelesen wurde.</text>
  <text class="mono-bold" x="82" y="956">spec_name</text>
  <text class="small" x="210" y="956">Name aus der `spec`-Deklaration.</text>
  <text class="mono-bold" x="82" y="982">env / sys</text>
  <text class="small" x="210" y="982">Variablen und Domains. Beide Signaturen muessen exakt gleich sein.</text>

  <rect class="panel-gray" x="656" y="812" width="568" height="190" rx="8" />
  <text class="h2" x="682" y="846">G. `baseline_synthesis` und `generated_synthesis`</text>
  <text class="mono-bold" x="682" y="878">status</text>
  <text class="small" x="850" y="878">synthesized, reused, failed oder timeout.</text>
  <text class="mono-bold" x="682" y="904">spectra_file / spectra_sha256</text>
  <text class="small" x="850" y="904">Eingabe-Spectra und Hash.</text>
  <text class="mono-bold" x="682" y="930">output_dir / controller_dir</text>
  <text class="small" x="850" y="930">Syntheseausgabe und JIT-Controllerordner.</text>
  <text class="mono-bold" x="682" y="956">jar / jar_sha256</text>
  <text class="small" x="850" y="956">Verwendete Spectra-CLI und Hash.</text>
  <text class="mono-bold" x="682" y="982">command, exit_code, timeout_seconds, raw_output_tail</text>

  <rect class="panel-green" x="56" y="1036" width="1168" height="250" rx="8" />
  <text class="h2" x="82" y="1070">H. `distance`: Metriken pro erfolgreichem Vergleich</text>
  <line class="divider" x1="82" y1="1094" x2="1198" y2="1094" />

  <text class="h3" x="82" y="1124">Trace-Ebene</text>
  <text class="mono-bold" x="82" y="1152">total_traces</text>
  <text class="small" x="284" y="1152">Anzahl getesteter Input-Traces.</text>
  <text class="mono-bold" x="82" y="1178">mismatching_traces</text>
  <text class="small" x="284" y="1178">Traces mit mindestens einem Output-Unterschied.</text>
  <text class="formula" x="82" y="1208">trace_mismatch_rate = mismatching_traces / total_traces</text>

  <text class="h3" x="524" y="1124">Step-Ebene</text>
  <text class="mono-bold" x="524" y="1152">total_steps</text>
  <text class="small" x="724" y="1152">Anzahl ausgefuehrter Zeitschritte.</text>
  <text class="mono-bold" x="524" y="1178">mismatching_steps</text>
  <text class="small" x="724" y="1178">Schritte mit mindestens einem Output-Unterschied.</text>
  <text class="formula" x="524" y="1208">step_mismatch_rate = mismatching_steps / total_steps</text>

  <text class="h3" x="82" y="1244">Output-Hamming-Ebene</text>
  <text class="mono-bold" x="82" y="1272">total_output_comparisons</text>
  <text class="small" x="284" y="1272">total_steps * Anzahl sys-Outputs.</text>
  <text class="mono-bold" x="524" y="1244">mismatching_output_comparisons</text>
  <text class="small" x="820" y="1244">Einzelne Output-Variablenwerte, die abweichen.</text>
  <text class="formula" x="524" y="1272">output_hamming_mismatch_rate = mismatching_output_comparisons / total_output_comparisons</text>

  <rect class="panel-orange" x="874" y="1114" width="318" height="92" rx="8" />
  <text class="h3" x="898" y="1142">first_mismatch</text>
  <text class="small" x="898" y="1166">Erstes Gegenbeispiel: trace_index,</text>
  <text class="small" x="898" y="1186">step_index, input_trace, inputs,</text>
  <text class="small" x="898" y="1206">outputs von A/B, differing_outputs.</text>

  <text class="mono-bold" x="874" y="1244">batches, mode, max_depth, trace_batch_size</text>
  <text class="small" x="874" y="1268">Laufparameter, die im Distanzobjekt mitgespeichert werden.</text>

  <rect class="panel" x="56" y="1320" width="1168" height="118" rx="8" />
  <text class="h2" x="82" y="1354">I. Aggregierte Summary am Ende des Skripts</text>
  <text class="mono-bold" x="82" y="1382">skill, model, mode, max_depth, max_paths, runs, output_jsonl</text>
  <text class="small" x="548" y="1382">Konfiguration und Zielpfad der JSONL-Ergebnisse.</text>
  <text class="mono-bold" x="82" y="1408">matching_synthesized_runs, selected_runs, evaluated_runs</text>
  <text class="small" x="548" y="1408">Anzahlen vor Limit, nach Limit und tatsaechlich ausgewertet.</text>
  <text class="mono-bold" x="82" y="1434">status_counts, skipped_counts</text>
  <text class="small" x="548" y="1434">Statusverteilung der Evaluation und Filtergruende aus der Run-Auswahl.</text>
  <text class="mono-bold" x="82" y="1460">trace_mismatch_rate / step_mismatch_rate / output_hamming_mismatch_rate</text>
  <text class="small" x="684" y="1460">Jeweils count, mean, median, min, max ueber erfolgreiche Runs.</text>

  <rect class="panel-orange" x="56" y="1500" width="1168" height="232" rx="8" />
  <text class="h2" x="82" y="1534">J. Zusaetzliche Werte aus `summarize_reconstruction_runs.py`</text>
  <text class="text" x="82" y="1562">Dieses Skript fasst Agenten-/Rekonstruktionsruns nach `skill` und `model` zusammen, unabhaengig von der Controller-Distanz.</text>
  <line class="divider" x1="82" y1="1584" x2="1198" y2="1584" />

  <text class="h3" x="82" y="1614">Run-Menge und CLI-Ergebnis</text>
  <text class="mono-bold" x="82" y="1640">total_runs</text>
  <text class="small" x="314" y="1640">Anzahl gefilterter Runs fuer skill/model.</text>
  <text class="mono-bold" x="82" y="1664">skipped_without_model</text>
  <text class="small" x="314" y="1664">Runs ohne erkennbares Modelllabel.</text>
  <text class="mono-bold" x="82" y="1688">cli_status</text>
  <text class="small" x="314" y="1688">Counts/Prozente fuer synthesized, unrealizable, syntax_error, timeout, missing usw.</text>

  <text class="h3" x="604" y="1614">Repair- und Method-3-Werte</text>
  <text class="mono-bold" x="604" y="1640">repair_loops</text>
  <text class="small" x="864" y="1640">Verteilung der gesamten Reparaturschleifen.</text>
  <text class="mono-bold" x="604" y="1664">syntax_repair_loops</text>
  <text class="small" x="864" y="1664">Syntaxreparaturen, falls vom Agenten berichtet.</text>
  <text class="mono-bold" x="604" y="1688">unrealizable_repair_loops</text>
  <text class="small" x="864" y="1688">Reparaturen nach Unrealizability-Diagnose.</text>
  <text class="mono-bold" x="604" y="1712">test_repair_loops</text>
  <text class="small" x="864" y="1712">Reparaturen nach Controller-Testfehlern.</text>

  <rect class="panel" x="56" y="1748" width="1168" height="0" rx="0" />
  <text class="mono-bold" x="82" y="1756">synthesized_with_zero_repair_loops, repair_attempted, synthesized_after_repair, counter_strategy_used, blocked_by_nl_conflict</text>
  <text class="small" x="82" y="1774">Zaehlen direkte Syntheseerfolge, Reparaturversuche, erfolgreiche Reparaturen, Counter-Strategy-Nutzung und Abbruch wegen NL-Konflikt.</text>

  <text class="mono-bold" x="604" y="1756">controller_tests</text>
  <text class="small" x="604" y="1774">runs_reported, tests_total, tests_passed, tests_failed, tests_passed_percent fuer Method-3-Testausgaben.</text>
</svg>
